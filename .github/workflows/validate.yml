name: Validate and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate and merge source rows
        run: python scripts/merge_rows.py

      - name: Check that committed datasets are current
        run: git diff --exit-code -- merged.json conditioning_atlas.tsv

      - name: Build workbook
        run: python scripts/build_xlsx.py

      - name: Build dashboard and GitHub Pages copy
        run: python scripts/build_dashboard.py

      - name: Validate genome panel and build Priming likelihood page
        run: python scripts/build_predictor.py

      - name: Verify dashboard and Priming likelihood outputs
        run: |
          cmp Conditioning_Atlas_dashboard.html docs/index.html
          cmp Priming_Likelihood.html docs/priming-likelihood.html
          python - <<'PY'
          from pathlib import Path

          dashboard = Path("docs/index.html").read_text(encoding="utf-8")
          assert dashboard.startswith("<!DOCTYPE html>")
          assert "__DATA__" not in dashboard
          assert "__FOOT__" not in dashboard
          assert "<title>The Conditioning Atlas</title>" in dashboard
          assert "priming-likelihood.html" in dashboard

          page = Path("docs/priming-likelihood.html").read_text(encoding="utf-8")
          assert page.startswith("<!DOCTYPE html>")
          for ph in ("__PANEL__", "__ATLAS__", "__MODEL__", "__FOOT__"):
              assert ph not in page, ph
          assert "<title>Priming likelihood</title>" in page
          PY

      - name: Upload rebuilt deliverables
        uses: actions/upload-artifact@v7
        with:
          name: conditioning-atlas-${{ github.sha }}
          path: |
            Conditioning_Atlas.xlsx
            Conditioning_Atlas_dashboard.html
            Priming_Likelihood.html
            conditioning_atlas.tsv
            genome_features.tsv
          if-no-files-found: error
          retention-days: 30
